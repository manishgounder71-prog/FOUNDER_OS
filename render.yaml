services:
  - type: web
    name: founder-os-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # Set this secret in the Render dashboard (free from ai.google.dev)
      - key: OPENROUTER_API_KEY
        sync: false          # Set this secret in the Render dashboard
      - key: QDRANT_PATH
        value: ./qdrant_db
      - key: QDRANT_URL
        sync: false          # Optional: Qdrant Cloud URL
      - key: QDRANT_API_KEY
        sync: false          # Optional: Qdrant Cloud API key
      - key: LYZR_API_KEY
        sync: false          # Lyzr AI API key (from studio.lyzr.ai)
      - key: LYZR_AGENT_ID
        sync: false          # Lyzr FounderOS Orchestrator agent ID
      - key: OMI_API_KEY
        sync: false          # Omi wearable security key
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000         # Render's default web service port
